# Finance & Crypto Niche Configuration

name: "finance_crypto"
display_name: "Finance & Cryptocurrency"
description: "Finance, investing, cryptocurrency, and personal finance topics"

# Keywords for topic discovery
keywords:
  - "cryptocurrency"
  - "Bitcoin"
  - "Ethereum"
  - "crypto news"
  - "investing"
  - "stock market"
  - "personal finance"
  - "passive income"
  - "crypto trading"
  - "DeFi"
  - "NFT"
  - "financial freedom"

# Seed topics
seed_topics:
  - "best crypto investments 2025"
  - "Bitcoin price prediction"
  - "passive income ideas"
  - "stock market analysis"

# Source configuration
sources:
  google_trends:
    enabled: true
    weight: 0.6
    region: "US"
    timeframe: "now 7-d"
    category: 7  # Finance category

  reddit:
    enabled: true
    weight: 0.4
    subreddits:
      - "CryptoCurrency"
      - "Bitcoin"
      - "ethereum"
      - "investing"
      - "stocks"
      - "personalfinance"
      - "CryptoMarkets"
      - "Daytrading"
    min_upvotes: 75
    time_filter: "week"

# Scoring thresholds
thresholds:
  min_search_volume: 2000
  max_competition: 0.8
  min_opportunity_score: 65.0
  min_trend_score: 50.0

# Format preferences
formats:
  preferred:
    - "explainer"
    - "tutorial"
    - "news"
    - "review"
  excluded:
    - "vlog"

# Regional settings
regional:
  target_regions:
    - "US"
    - "GB"
    - "CA"
  target_languages:
    - "en"

# Custom settings
custom:
  compliance_aware: true  # Be mindful of financial advice regulations
  focus_on_education: true
  avoid_price_predictions: false
